<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Servis | Toko Gitar AYRI</title>
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#15100c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
    <link rel="stylesheet" href="theme-dark.css">
    <link rel="stylesheet" href="layanan.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="layanan-config.js"></script>
    <script src="layanan.js"></script>
    <script src="artikel-md.js"></script>
</head>
<body class="ly">
    <header class="ly-top">
        <b>AYRI <span>Admin</span></b>
        <nav class="ly-tabs" id="tabs" hidden><a href="#servis">Servis</a><a href="#artikel">Artikel</a></nav>
        <button type="button" id="keluar" class="ly-btn ly-btn--sm" hidden>Keluar</button>
    </header>
    <main class="ly-main" id="app"><p class="ly-kosong">Memuat&hellip;</p></main>
    <div class="ly-toast" id="toast" role="status" aria-live="polite"></div>

    <script>
(function () {
    var L = Layanan, C = L.C, A = L.api, E = L.esc, app = document.getElementById('app');
    var cache = null, ed = null, ae = null, dirty = false, filter = 'aktif', cari = '';
    var AKTIF = ['menunggu_dp', 'antri', 'dikerjakan', 'selesai'];

    function $(s, r) { return (r || document).querySelector(s); }
    function $$(s, r) { return [].slice.call((r || document).querySelectorAll(s)); }
    function toast(msg, err) {
        var t = $('#toast'); t.textContent = msg; t.className = 'ly-toast on' + (err ? ' err' : '');
        clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = 'ly-toast'; }, err ? 7000 : 3500);
    }
    function pesanError(e) {
        var m = (e && e.message) || String(e);
        if (/invalid login/i.test(m)) return 'Email atau kata sandi salah.';
        if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Koneksi internet bermasalah. Coba lagi.';
        if (/row-level security|permission denied/i.test(m)) return 'Akses ditolak: akun ini belum terdaftar sebagai admin (lihat panduan langkah 4).';
        if (/exceeded the maximum allowed size|payload too large/i.test(m)) return 'Foto terlalu besar.';
        return m;
    }
    function gagal(e) { if (window.console) console.error(e); toast(pesanError(e), true); }
    function sibuk(btn, on, teks) {
        if (!btn) return;
        if (on) { btn.dataset.t = btn.textContent; btn.textContent = teks || 'Menyimpan…'; btn.disabled = true; }
        else { btn.textContent = btn.dataset.t || btn.textContent; btn.disabled = false; }
    }
    function setDirty(v) { dirty = v; var d = $('#dirty'); if (d) d.hidden = !v; }
    function opsi(list, cur) { return list.map(function (o) { var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o; return '<option value="' + E(v) + '"' + (String(v) === String(cur == null ? '' : cur) ? ' selected' : '') + '>' + E(t) + '</option>'; }).join(''); }
    function urut(k) { return function (a, b) { return a[k] < b[k] ? -1 : a[k] > b[k] ? 1 : 0; }; }
    function gitarNama(s) { return [s.gitar_jenis, s.gitar_merk].filter(Boolean).join(' ') || 'Gitar'; }
    function bukaWa(hp, teks) { window.open(L.waLink(hp, teks), '_blank', 'noopener'); }

    /* ================= masuk / keluar ================= */
    function mulai() {
        if (!L.siap) {
            app.innerHTML = '<section class="ly-login"><div class="ly-card"><h2>Layanan belum disambungkan</h2><p class="ly-muted">Isi <b>supabaseUrl</b> dan <b>supabaseAnonKey</b> di file <code>layanan-config.js</code> (lihat <code>supabase/PANDUAN.md</code>, langkah 5).</p></div></section>';
            return;
        }
        A.sesi().then(function (s) {
            if (!s) return layarMasuk();
            return A.cekAdmin().then(function (ok) { ok ? masukOk() : bukanAdmin(); });
        }).catch(gagal);
    }
    function layarMasuk() {
        app.innerHTML = '<section class="ly-login"><form class="ly-card ly-f" id="f-masuk"><h2>Masuk admin</h2>' +
            '<label>Email<input type="email" name="email" autocomplete="username" required></label>' +
            '<label>Kata sandi<input type="password" name="sandi" autocomplete="current-password" required></label>' +
            '<button class="ly-btn ly-btn--pri">Masuk</button><p class="ly-muted">Halaman khusus admin Toko Gitar AYRI.</p></form></section>';
        $('#f-masuk').addEventListener('submit', function (e) {
            e.preventDefault(); var f = e.target, b = $('button', f); sibuk(b, true, 'Masuk…');
            A.masuk(f.email.value.trim(), f.sandi.value).then(function () { return A.cekAdmin(); })
                .then(function (ok) { ok ? masukOk() : bukanAdmin(); })
                .catch(function (err) { sibuk(b, false); gagal(err); });
        });
    }
    function bukanAdmin() {
        app.innerHTML = '<section class="ly-login"><div class="ly-card"><h2>Bukan akun admin</h2><p class="ly-muted">Akun ini berhasil masuk, tapi belum didaftarkan sebagai admin. Jalankan <code>supabase/2-jadikan-admin.sql</code> dengan email akun ini (panduan langkah 4), lalu muat ulang halaman.</p><p><button type="button" class="ly-btn" id="b-keluar2">Keluar</button></p></div></section>';
        $('#b-keluar2').addEventListener('click', keluar);
    }
    function masukOk() { $('#tabs').hidden = false; $('#keluar').hidden = false; rute(); }
    function keluar() { A.keluar().then(function () { location.hash = ''; location.reload(); }); }
    $('#keluar').addEventListener('click', function () { if (!dirty || confirm('Perubahan belum disimpan. Tetap keluar?')) keluar(); });

    /* ================= rute: #servis, #servis/<id>, #servis/baru, #artikel, ... ================= */
    var hashLama = location.hash;
    function rute() {
        var p = (location.hash.replace(/^#/, '') || 'servis').split('/');
        $$('#tabs a').forEach(function (a) { a.setAttribute('aria-current', a.getAttribute('href') === '#' + p[0] ? 'page' : 'false'); });
        window.scrollTo(0, 0);
        if (p[0] === 'artikel') return p[1] ? bukaArtikel(p[1] === 'baru' ? null : p[1]) : daftarArtikel();
        return p[1] ? bukaServis(p[1] === 'baru' ? null : p[1]) : daftarServis();
    }
    window.addEventListener('hashchange', function () {
        if (dirty && !confirm('Perubahan belum disimpan. Tinggalkan halaman ini?')) { history.replaceState(null, '', hashLama || '#servis'); return; }
        setDirty(false); hashLama = location.hash; rute();
    });
    window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

    /* ================= daftar servis ================= */
    function daftarServis() {
        app.innerHTML = '<section><div class="ly-head"><h1>Servis</h1><a class="ly-btn ly-btn--pri" href="#servis/baru">+ Gitar masuk</a></div>' +
            '<div class="ly-cari"><input class="ly-in" id="cari" type="search" placeholder="Cari kode, nama, no. HP, merk…" autocomplete="off"></div>' +
            '<div class="ly-filter" id="filter"></div><div class="ly-list" id="list"><p class="ly-kosong">Memuat…</p></div></section>';
        $('#cari').value = cari;
        $('#cari').addEventListener('input', function () { cari = this.value; gambarDaftar(); });
        $('#filter').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; gambarDaftar(); } });
        if (cache) gambarDaftar();
        A.daftarServis().then(function (rows) { cache = rows; gambarDaftar(); })
            .catch(function (e) { $('#list').innerHTML = '<p class="ly-kosong">Gagal memuat data.</p>'; gagal(e); });
    }
    function gambarDaftar() {
        if (!$('#list')) return;
        var rows = cache || [], n = {}, hari = L.hariIni(), c = cari.trim().toLowerCase();
        rows.forEach(function (s) { n[s.status] = (n[s.status] || 0) + 1; });
        var f = [['aktif', 'Aktif', rows.filter(function (s) { return AKTIF.indexOf(s.status) > -1; }).length]]
            .concat(L.URUT_STATUS.concat('batal').map(function (k) { return [k, L.STATUS[k].label.replace(/ – .*/, ''), n[k] || 0]; }))
            .concat([['semua', 'Semua', rows.length]]);
        $('#filter').innerHTML = f.map(function (x) { return '<button type="button" data-f="' + x[0] + '" aria-pressed="' + (filter === x[0]) + '">' + E(x[1]) + '<b>' + x[2] + '</b></button>'; }).join('');
        var hasil = rows.filter(function (s) {
            if (filter === 'aktif' ? AKTIF.indexOf(s.status) < 0 : filter !== 'semua' && s.status !== filter) return false;
            return !c || [s.kode, s.nama, s.hp, s.gitar_jenis, s.gitar_merk, s.keluhan].join(' ').toLowerCase().indexOf(c) > -1;
        });
        $('#list').innerHTML = hasil.length ? hasil.map(function (s) {
            var h = L.hitung(s, s.servis_item, s.servis_bayar), telat = s.estimasi && s.estimasi < hari && ['menunggu_dp', 'antri', 'dikerjakan'].indexOf(s.status) > -1;
            var bayar = !h.total ? 'Biaya belum diisi' : h.lunas ? 'Lunas' : h.kurangAwal ? '<span class="ly-warn">Bayar awal kurang ' + L.rupiah(h.kurangAwal) + '</span>' : 'Sisa ' + L.rupiah(h.sisa);
            return '<a class="ly-item" href="#servis/' + s.id + '"><span class="ly-item__k">' + E(s.kode) + '</span><span class="st-chip st-' + s.status + '">' + E(L.STATUS[s.status].label) + '</span>' +
                '<span class="ly-item__t">' + E(gitarNama(s)) + ' · ' + E(s.nama) + '</span>' +
                '<span class="ly-item__m"><span>Masuk ' + L.tgl(s.tgl_masuk) + '</span>' + (s.estimasi ? '<span' + (telat ? ' class="ly-telat"' : '') + '>Estimasi ' + L.tgl(s.estimasi) + (telat ? ' (lewat)' : '') + '</span>' : '') + '<span>' + bayar + '</span></span></a>';
        }).join('') : '<p class="ly-kosong">' + (rows.length ? 'Tidak ada yang cocok.' : 'Belum ada data servis. Tekan “+ Gitar masuk”.') + '</p>';
    }

    /* ================= form servis ================= */
    function servisKosong() {
        return { nama: '', hp: '', tgl_masuk: L.hariIni(), gitar_jenis: (C.jenisGitar || ['Akustik'])[0], gitar_merk: '', keluhan: '', status: 'menunggu_dp', estimasi: '', diskon: 0, saran: '', catatan_publik: '', catatan_admin: '', izin_publikasi: false };
    }
    function bukaServis(id) {
        app.innerHTML = '<p class="ly-kosong">Memuat…</p>';
        if (!id) { ed = { baru: true, s: servisKosong(), items: [], bayar: [], foto: [], antri: [] }; return gambarServis(); }
        A.ambilServis(id).then(function (s) {
            ed = { baru: false, id: s.id, s: s, items: (s.servis_item || []).sort(urut('urut')), bayar: (s.servis_bayar || []).sort(urut('tgl')), foto: (s.servis_foto || []).sort(urut('created_at')), antri: [] };
            gambarServis();
        }).catch(function (e) { app.innerHTML = '<p class="ly-kosong">Data tidak ditemukan. <a href="#servis">Kembali ke daftar</a></p>'; gagal(e); });
    }
    function gambarServis() {
        var s = ed.s, katalog = {}, kat = '';
        (C.katalogJasa || []).forEach(function (k, i) { (katalog[k.grup] = katalog[k.grup] || []).push('<option value="' + i + '">' + E(k.nama) + (k.harga ? ' – ' + L.rupiah(k.harga) : '') + '</option>'); });
        for (var g in katalog) kat += '<optgroup label="' + E(g) + '">' + katalog[g].join('') + '</optgroup>';
        var jenis = (C.jenisGitar || []).slice(); if (s.gitar_jenis && jenis.indexOf(s.gitar_jenis) < 0) jenis.push(s.gitar_jenis);
        app.innerHTML = '<section id="sv" class="ly-f">' +
            '<div class="ly-head"><a class="ly-back" href="#servis">‹ Daftar servis</a></div>' +
            '<div class="ly-head"><h1>' + (ed.baru ? 'Gitar masuk' : E(gitarNama(s))) + '</h1>' + (ed.baru ? '' : '<span class="st-chip st-' + s.status + '" id="sv-chip">' + E(L.STATUS[s.status].label) + '</span>') + '</div>' +
            (ed.baru ? '<p class="ly-muted">Kode servis dibuat otomatis saat disimpan.</p>' : '<div class="ly-kode">' + E(s.kode) + ' <span class="ly-muted" style="font:600 .8rem var(--font-sans);letter-spacing:0">· 4 digit HP: ' + E(L.hp4(s.hp)) + '</span></div>') +

            '<fieldset class="ly-card ly-f"><legend>Pelanggan</legend>' +
            '<label>Nama<input data-f="nama" autocomplete="off" required></label>' +
            '<label>No. HP / WhatsApp<input data-f="hp" type="tel" inputmode="tel" autocomplete="off" placeholder="08xxxxxxxxxx" required></label></fieldset>' +

            '<fieldset class="ly-card ly-f"><legend>Gitar</legend>' +
            '<div class="ly-row2"><label>Jenis<select data-f="gitar_jenis">' + opsi(jenis, s.gitar_jenis) + '</select></label>' +
            '<label>Merk / model<input data-f="gitar_merk" placeholder="mis. Yamaha F310"></label></div>' +
            '<label>Keluhan / kerusakan<textarea data-f="keluhan" rows="3" placeholder="mis. senar fret buzz di fret 3–5, bridge mulai terangkat"></textarea></label>' +
            '<div class="ly-row2"><label>Tanggal masuk<input type="date" data-f="tgl_masuk"></label><label>Estimasi selesai<input type="date" data-f="estimasi"></label></div>' +
            '<label class="ly-cek"><input type="checkbox" data-f="izin_publikasi"> Pelanggan setuju foto gitarnya dipakai untuk artikel (tanpa nama dan nomor HP)</label></fieldset>' +

            '<fieldset class="ly-card"><legend>Jasa &amp; part</legend><div class="ly-items" id="sv-items"></div>' +
            '<div class="ly-add"><select class="ly-in" id="sv-katalog"><option value="">+ Tambah jasa dari daftar…</option>' + kat + '</select>' +
            '<button type="button" class="ly-btn ly-btn--sm" data-act="jasa">+ Jasa lain</button><button type="button" class="ly-btn ly-btn--sm" data-act="part">+ Part / suku cadang</button></div>' +
            '<div class="ly-f" style="margin-top:12px"><label style="max-width:220px">Diskon (Rp)<input type="number" inputmode="numeric" min="0" step="1000" data-f="diskon"></label></div>' +
            '<div class="ly-sum" id="sv-sum"></div></fieldset>' +

            '<fieldset class="ly-card"><legend>Pembayaran</legend><div class="ly-bayar" id="sv-bayar"></div>' +
            '<div class="ly-f" style="margin-top:10px"><div class="ly-row2"><label>Jumlah (Rp)<input type="number" inputmode="numeric" min="0" step="1000" id="by-jml"></label>' +
            '<label>Jenis<select id="by-jenis">' + opsi([['dp', 'DP / bayar awal'], ['tambahan', 'Tambahan'], ['pelunasan', 'Pelunasan']], 'dp') + '</select></label></div>' +
            '<div class="ly-row2"><label>Metode<select id="by-metode">' + opsi([['tunai', 'Tunai'], ['transfer', 'Transfer'], ['qris', 'QRIS']], 'tunai') + '</select></label><label>Tanggal<input type="date" id="by-tgl"></label></div>' +
            '<button type="button" class="ly-btn" id="by-tambah">Catat pembayaran</button></div></fieldset>' +

            '<fieldset class="ly-card"><legend>Status</legend><div class="ly-status" id="sv-status"></div><p class="ly-hint" style="margin-top:8px">Aturan toko: gitar dikerjakan setelah DP ' + (C.dpJasaPersen == null ? 50 : C.dpJasaPersen) + '% jasa + part lunas. Status otomatis pindah ke <b>Antri</b> saat pembayaran awal terpenuhi.</p></fieldset>' +

            '<fieldset class="ly-card"><legend>Foto</legend><div id="sv-foto"></div><p class="ly-hint" style="margin-top:10px">Foto dikecilkan otomatis (WebP ±200 KB) sebelum diunggah. Label <b>Tampil</b> = terlihat pelanggan; ketuk untuk menyembunyikan. Foto sesudah servis baru terlihat pelanggan saat status Selesai.</p></fieldset>' +

            '<fieldset class="ly-card ly-f"><legend>Untuk pelanggan</legend>' +
            '<label>Pesan / update (tampil di halaman cek status)<textarea data-f="catatan_publik" rows="3" placeholder="mis. Ditemukan truss rod macet, perlu diganti. Estimasi mundur 2 hari."></textarea></label>' +
            '<label>Saran setelah servis (tampil saat status Selesai)<textarea data-f="saran" rows="3" placeholder="mis. Senar sudah aus, sarankan ganti Elixir 11. Tuner kendur, bisa upgrade ke Grover."></textarea></label></fieldset>' +

            '<fieldset class="ly-card ly-f"><legend>Catatan internal</legend><label>Hanya terlihat admin<textarea data-f="catatan_admin" rows="2"></textarea></label></fieldset>' +

            (ed.baru ? '' : '<fieldset class="ly-card"><legend>Kirim &amp; lainnya</legend><div class="ly-btns">' +
                '<button type="button" class="ly-btn ly-btn--wa" data-wa="tandaTerima">WA: Tanda terima</button>' +
                '<button type="button" class="ly-btn ly-btn--wa" data-wa="update">WA: Update status</button>' +
                '<button type="button" class="ly-btn ly-btn--wa" data-wa="selesai">WA: Kabari selesai</button>' +
                '<button type="button" class="ly-btn ly-btn--wa" data-wa="nota">WA: Kirim nota</button></div>' +
                '<div class="ly-btns" style="margin-top:8px"><a class="ly-btn" target="_blank" href="cek-servis.html?k=' + encodeURIComponent(s.kode) + '&amp;h=' + encodeURIComponent(L.hp4(s.hp)) + '">Lihat halaman pelanggan</a>' +
                '<a class="ly-btn" target="_blank" href="nota.html?k=' + encodeURIComponent(s.kode) + '&amp;h=' + encodeURIComponent(L.hp4(s.hp)) + '">Buka / cetak nota</a>' +
                '<button type="button" class="ly-btn" id="sv-artikel">Jadikan artikel</button><button type="button" class="ly-btn ly-btn--del" id="sv-hapus">Hapus servis</button></div></fieldset>') +

            '<div class="ly-save"><span class="ly-dirty" id="dirty" hidden>Belum disimpan</span><button type="button" class="ly-btn ly-btn--pri" id="sv-simpan">' + (ed.baru ? 'Simpan &amp; buat kode' : 'Simpan perubahan') + '</button></div></section>';

        $$('[data-f]', app).forEach(function (el) {
            var v = s[el.dataset.f];
            if (el.type === 'checkbox') el.checked = !!v; else el.value = v == null ? '' : v;
        });
        $('#by-tgl').value = L.hariIni();
        gambarItems(); gambarRingkas(); gambarBayar(); gambarStatus(); gambarFoto();
        setDirty(false);

        var sv = $('#sv');
        sv.addEventListener('input', ubahField); sv.addEventListener('change', ubahField);
        sv.addEventListener('click', klikServis);
        $('#sv-katalog').addEventListener('change', function () {
            var k = (C.katalogJasa || [])[+this.value]; this.value = ''; if (!k) return;
            ed.items.push({ jenis: 'jasa', nama: k.nama, harga: k.harga || 0, qty: 1, garansi: k.garansi || '', garansi_syarat: k.jatuh ? C.syaratJatuh : '' });
            gambarItems(); gambarRingkas(); setDirty(true);
            if (!k.harga) { var ins = $$('#sv-items [data-k="harga"]'); ins[ins.length - 1].focus(); }
        });
        $('#by-tambah').addEventListener('click', tambahBayar);
        $('#sv-simpan').addEventListener('click', simpanServis);
        $('#sv-foto').addEventListener('change', function (e) { if (e.target.type === 'file') { tambahFoto(e.target.dataset.tahap, [].slice.call(e.target.files)); e.target.value = ''; } });
        if (!ed.baru) { $('#sv-artikel').addEventListener('click', jadikanArtikel); $('#sv-hapus').addEventListener('click', hapusServis); }
    }
    function ubahField(e) {
        var t = e.target;
        if (t.dataset.f) {
            ed.s[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.dataset.f === 'diskon' ? Math.max(0, Math.round(+t.value || 0)) : t.value;
            setDirty(true); if (t.dataset.f === 'diskon') gambarRingkas();
        } else if (t.dataset.k) {
            var it = ed.items[+t.closest('[data-i]').dataset.i], k = t.dataset.k;
            if (k === 'jatuh') it.garansi_syarat = t.checked ? C.syaratJatuh : '';
            else it[k] = k === 'harga' || k === 'qty' ? Math.max(k === 'qty' ? 1 : 0, Math.round(+t.value || 0)) : t.value;
            setDirty(true); if (k === 'harga' || k === 'qty') gambarRingkas();
        }
    }
    function gambarItems() {
        $('#sv-items').innerHTML = ed.items.length ? ed.items.map(function (it, i) {
            var hapus = '<button type="button" class="ly-x" data-del="' + i + '" aria-label="Hapus">×</button>';
            if (it.jenis === 'part') return '<div class="ly-it" data-i="' + i + '"><div class="ly-it__tag">Part' + hapus + '</div>' +
                '<input class="ly-in ly-it__n" data-k="nama" placeholder="Nama part, mis. Senar Elixir 11" value="' + E(it.nama) + '" aria-label="Nama part">' +
                '<label class="ly-lbl">Jumlah<input class="ly-in" data-k="qty" type="number" inputmode="numeric" min="1" value="' + (it.qty || 1) + '"></label>' +
                '<label class="ly-lbl">Harga satuan (Rp)<input class="ly-in" data-k="harga" type="number" inputmode="numeric" min="0" step="1000" value="' + (it.harga || 0) + '"></label></div>';
            return '<div class="ly-it" data-i="' + i + '"><div class="ly-it__tag">Jasa' + hapus + '</div>' +
                '<input class="ly-in ly-it__n" data-k="nama" placeholder="Nama jasa" value="' + E(it.nama) + '" aria-label="Nama jasa">' +
                '<label class="ly-lbl">Harga (Rp)<input class="ly-in" data-k="harga" type="number" inputmode="numeric" min="0" step="1000" value="' + (it.harga || 0) + '"></label>' +
                '<label class="ly-lbl">Garansi<select class="ly-in" data-k="garansi">' + opsi(L.GARANSI_PILIHAN, it.garansi || '') + '</select></label>' +
                '<label class="ly-cek ly-it__n" style="font-size:.75rem"><input type="checkbox" data-k="jatuh"' + (it.garansi_syarat ? ' checked' : '') + '> Syarat garansi: gitar tidak jatuh/terbentur lagi</label></div>';

                if (k === 'slug') ae.slugManual = true;
                infoArtikel(); if (!$('#ar-pv').hidden) pratinjau();
            } else if (i != null) { a.foto[+i].alt = t.value; setDirty(true); }
        });
        ar.addEventListener('change', function (e) { if (e.target.dataset.a === 'status') { a.status = e.target.value; setDirty(true); } });
        ar.addEventListener('click', function (e) {
            var t = e.target.closest('button'); if (!t) return; var d = t.dataset;
            if (t.id === 'ar-prev') { var pv = $('#ar-pv'); pv.hidden = !pv.hidden; t.textContent = pv.hidden ? 'Pratinjau' : 'Tutup pratinjau'; if (!pv.hidden) pratinjau(); }
            else if (d.fdel != null) { a.foto.splice(+d.fdel, 1); gambarAFoto(); setDirty(true); }
            else if (d.fup != null) { var i = +d.fup; if (i > 0) { var x = a.foto[i]; a.foto[i] = a.foto[i - 1]; a.foto[i - 1] = x; gambarAFoto(); setDirty(true); } }
            else if (d.pick) {
                var f = ae.fotoServis.filter(function (x) { return x.id === d.pick; })[0], ada = a.foto.map(function (x) { return x.url; }).indexOf(f.url);
                if (ada > -1) a.foto.splice(ada, 1); else a.foto.push({ url: f.url, thumb_url: f.thumb_url, alt: L.TAHAP[f.tahap] });
                gambarAFoto(); setDirty(true);
            }
        });
        $('#ar-file').addEventListener('change', function () {
            var files = [].slice.call(this.files); this.value = ''; if (!files.length) return;
            toast('Mengunggah ' + files.length + ' foto…');
            files.reduce(function (p, file) {
                return p.then(function () { return L.kompres(file).then(A.unggahFotoArtikel).then(function (u) { a.foto.push({ url: u, thumb_url: u, alt: '' }); gambarAFoto(); setDirty(true); }); });
            }, Promise.resolve()).then(function () { toast('Foto terunggah. Jangan lupa Simpan.'); }).catch(gagal);
        });
        $('#ar-simpan').addEventListener('click', simpanArtikel);
        if (!ae.baru) $('#ar-hapus').addEventListener('click', function () {
            if (!confirm('Hapus artikel ini? Kalau sudah terbit, halamannya ikut hilang dari situs pada pembaruan berikutnya.')) return;
            A.hapusArtikel(ae.id).then(function () { setDirty(false); toast('Artikel dihapus.'); location.hash = '#artikel'; }).catch(gagal);
        });
    }
    function infoArtikel() {
        var a = ae.a; $('#ar-url').textContent = 'ayrigitar.com/artikel-' + (a.slug || '…') + '.html';
        $('#ar-n').textContent = (a.ringkasan || '').length + '/160';
    }
    function pratinjau() {
        var a = ae.a, f = a.foto[0];
        $('#ar-pv').innerHTML = '<p class="ly-muted">' + E(a.tag) + '</p><h2>' + E(a.judul || '(tanpa judul)') + '</h2>' + (f ? '<img src="' + E(f.url) + '" alt="" style="border-radius:12px;margin:10px 0">' : '') + ArtikelMd.keHtml(a.isi);
    }
    function gambarAFoto() {
        if (!$('#ar-foto')) return;
        var a = ae.a;
        $('#ar-foto').innerHTML = a.foto.length ? a.foto.map(function (f, i) {
            return '<div><img src="' + E(f.thumb_url || f.url) + '" alt=""><input class="ly-in" data-alt="' + i + '" value="' + E(f.alt) + '" placeholder="Keterangan foto"><span class="ly-btns" style="flex-wrap:nowrap">' +
                (i ? '<button type="button" class="ly-x" data-fup="' + i + '" aria-label="Naikkan">↑</button>' : '') + '<button type="button" class="ly-x" data-fdel="' + i + '" aria-label="Hapus dari artikel">×</button></span></div>';
        }).join('') : '<p class="ly-muted">Belum ada foto.</p>';
        var pick = $('#ar-pick'), dipakai = a.foto.map(function (x) { return x.url; });
        pick.innerHTML = ae.fotoServis.length ? '<p class="ly-hint" style="margin:12px 0 6px">Foto dari data servis (ketuk untuk pakai/lepas):</p><div class="ly-pick">' + ae.fotoServis.map(function (f) {
            return '<button type="button" data-pick="' + f.id + '" aria-pressed="' + (dipakai.indexOf(f.url) > -1) + '"><img src="' + E(f.thumb_url || f.url) + '" alt="' + E(L.TAHAP[f.tahap]) + '"></button>';
        }).join('') + '</div>' : '';
    }
    function simpanArtikel() {
        var a = ae.a;
        a.judul = (a.judul || '').trim(); a.slug = ArtikelMd.slug(a.slug || a.judul);
        if (!a.judul) return toast('Judul belum diisi.', true);
        if (!a.slug) return toast('Alamat halaman belum benar.', true);
        if (a.status === 'terbit') {
            if (!a.isi.trim()) return toast('Isi artikel masih kosong.', true);
            if (/\((Ceritakan|Tulis)[^)]*\)/.test(a.isi) && !confirm('Masih ada teks contoh dalam tanda kurung (mis. “(Ceritakan hasilnya…)”). Tetap terbitkan?')) return;
            if (!a.ringkasan.trim()) a.ringkasan = ArtikelMd.teksPolos(a.isi).slice(0, 157) + '…';
            if (a.foto.some(function (f) { return !String(f.alt || '').trim(); })) return toast('Isi keterangan untuk setiap foto dulu.', true);
        }
        var b = $('#ar-simpan'); sibuk(b, true);
        A.simpanArtikel(ae.id, a).then(function (row) {
            setDirty(false); toast(row.status === 'terbit' ? 'Tersimpan. Halaman situs diperbarui otomatis dalam ±1 jam.' : 'Draf tersimpan.');
            if (ae.baru) { hashLama = '#artikel/' + row.id; location.hash = hashLama; } else { sibuk(b, false); ae.a = row; gambarArtikel(); }
        }).catch(function (e) { sibuk(b, false); if (e.code === '23505') toast('Alamat halaman sudah dipakai artikel lain. Ubah sedikit alamatnya.', true); else gagal(e); });
    }

    mulai();
})();
    </script>
</body>
</html>
